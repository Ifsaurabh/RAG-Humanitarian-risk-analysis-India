<svg xmlns="http://www.w3.org/2000/svg" width="980" height="1840" viewBox="0 0 980 1840" font-family="Segoe UI, Arial, sans-serif">
<rect width="980" height="1840" fill="#ffffff"/>
<g transform="translate(0,10)">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#555"/>
    </marker>
  </defs>
  <rect width="980" height="620" fill="#ffffff"/>
  <text x="490" y="35" text-anchor="middle" font-size="22" font-weight="700" fill="#1a1a1a">RAG Humanitarian Risk Analysis India — Deployed Pipeline (Pinecone)</text>

  <!-- Row 1: Data sources -->
  <rect x="40" y="70" width="180" height="60" rx="8" fill="#e8f0fe" stroke="#4285f4" stroke-width="2"/>
  <text x="130" y="95" text-anchor="middle" font-size="13" font-weight="600">WFP Food Price</text>
  <text x="130" y="113" text-anchor="middle" font-size="13" font-weight="600">Dataset</text>

  <rect x="260" y="70" width="180" height="60" rx="8" fill="#e8f0fe" stroke="#4285f4" stroke-width="2"/>
  <text x="350" y="95" text-anchor="middle" font-size="13" font-weight="600">MPI Poverty</text>
  <text x="350" y="113" text-anchor="middle" font-size="13" font-weight="600">Dataset</text>

  <!-- Chunk & Embed -->
  <rect x="150" y="170" width="340" height="60" rx="8" fill="#fef7e0" stroke="#f9ab00" stroke-width="2"/>
  <text x="320" y="195" text-anchor="middle" font-size="13" font-weight="600">Chunk &amp; Preprocess</text>
  <text x="320" y="213" text-anchor="middle" font-size="13" font-weight="600">Embed (all-MiniLM-L6-v2)</text>

  <!-- Pinecone -->
  <rect x="150" y="270" width="340" height="70" rx="8" fill="#e6f4ea" stroke="#34a853" stroke-width="2"/>
  <text x="320" y="292" text-anchor="middle" font-size="13" font-weight="700">Pinecone Index (Deployed)</text>
  <text x="320" y="310" text-anchor="middle" font-size="12">205,525 vectors — 2 namespaces</text>
  <text x="320" y="326" text-anchor="middle" font-size="11" fill="#555">food_prices | poverty_mpi</text>

  <!-- User query -->
  <rect x="700" y="70" width="200" height="60" rx="8" fill="#fce8e6" stroke="#ea4335" stroke-width="2"/>
  <text x="800" y="105" text-anchor="middle" font-size="14" font-weight="600">User Query</text>

  <!-- FastAPI + Auth -->
  <rect x="670" y="170" width="260" height="60" rx="8" fill="#f3e8fd" stroke="#a142f4" stroke-width="2"/>
  <text x="800" y="195" text-anchor="middle" font-size="13" font-weight="600">FastAPI + HTTPBasic Auth</text>
  <text x="800" y="213" text-anchor="middle" font-size="12">docs endpoint (/docs)</text>

  <!-- Namespace-aware retrieval -->
  <rect x="600" y="270" width="330" height="70" rx="8" fill="#e6f4ea" stroke="#34a853" stroke-width="2"/>
  <text x="765" y="292" text-anchor="middle" font-size="13" font-weight="600">Namespace-aware Retrieval</text>
  <text x="765" y="310" text-anchor="middle" font-size="12">LangChain LCEL</text>
  <text x="765" y="326" text-anchor="middle" font-size="11" fill="#555">top-k: 100 food / 50 poverty</text>

  <!-- LLM -->
  <rect x="620" y="390" width="290" height="60" rx="8" fill="#fef7e0" stroke="#f9ab00" stroke-width="2"/>
  <text x="765" y="425" text-anchor="middle" font-size="14" font-weight="600">Claude Haiku (Generation)</text>

  <!-- Cited answer -->
  <rect x="650" y="490" width="230" height="60" rx="8" fill="#fce8e6" stroke="#ea4335" stroke-width="2"/>
  <text x="765" y="525" text-anchor="middle" font-size="14" font-weight="600">Cited Answer</text>

  <!-- Arrows: ingestion -->
  <line x1="130" y1="130" x2="280" y2="170" stroke="#555" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="350" y1="130" x2="360" y2="170" stroke="#555" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="320" y1="230" x2="320" y2="270" stroke="#555" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Arrows: query path -->
  <line x1="800" y1="130" x2="800" y2="170" stroke="#555" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="800" y1="230" x2="785" y2="270" stroke="#555" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="765" y1="340" x2="765" y2="390" stroke="#555" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="765" y1="450" x2="765" y2="490" stroke="#555" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Pinecone -> Retrieval cross link -->
  <line x1="490" y1="305" x2="600" y2="305" stroke="#34a853" stroke-width="2" stroke-dasharray="5,4" marker-end="url(#arrow)"/>
  <text x="545" y="298" text-anchor="middle" font-size="10" fill="#34a853">similarity search</text>

  <text x="490" y="595" text-anchor="middle" font-size="12" fill="#777">github.com/Ifsaurabh/RAG-Humanitarian-risk-analysis-India (Pinecone-deployed path only)</text>
</g>
<g transform="translate(40,670)">
  <defs>
    <marker id="arrow2" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#555"/>
    </marker>
  </defs>
  <rect width="900" height="480" fill="#ffffff"/>
  <text x="450" y="35" text-anchor="middle" font-size="20" font-weight="700" fill="#1a1a1a">Ingestion Path — Detail</text>

  <rect x="60" y="70" width="220" height="60" rx="8" fill="#e8f0fe" stroke="#4285f4" stroke-width="2"/>
  <text x="170" y="105" text-anchor="middle" font-size="13" font-weight="600">WFP Food Price Data</text>

  <rect x="620" y="70" width="220" height="60" rx="8" fill="#e8f0fe" stroke="#4285f4" stroke-width="2"/>
  <text x="730" y="105" text-anchor="middle" font-size="13" font-weight="600">MPI Poverty Data</text>

  <rect x="60" y="170" width="220" height="60" rx="8" fill="#fef7e0" stroke="#f9ab00" stroke-width="2"/>
  <text x="170" y="196" text-anchor="middle" font-size="12" font-weight="600">Chunk &amp; Preprocess</text>
  <text x="170" y="214" text-anchor="middle" font-size="12">(food_prices)</text>

  <rect x="620" y="170" width="220" height="60" rx="8" fill="#fef7e0" stroke="#f9ab00" stroke-width="2"/>
  <text x="730" y="196" text-anchor="middle" font-size="12" font-weight="600">Chunk &amp; Preprocess</text>
  <text x="730" y="214" text-anchor="middle" font-size="12">(poverty_mpi)</text>

  <rect x="60" y="270" width="220" height="60" rx="8" fill="#fef7e0" stroke="#f9ab00" stroke-width="2"/>
  <text x="170" y="296" text-anchor="middle" font-size="12" font-weight="600">Embed Chunks</text>
  <text x="170" y="314" text-anchor="middle" font-size="11">all-MiniLM-L6-v2</text>

  <rect x="620" y="270" width="220" height="60" rx="8" fill="#fef7e0" stroke="#f9ab00" stroke-width="2"/>
  <text x="730" y="296" text-anchor="middle" font-size="12" font-weight="600">Embed Chunks</text>
  <text x="730" y="314" text-anchor="middle" font-size="11">all-MiniLM-L6-v2</text>

  <rect x="250" y="380" width="400" height="70" rx="8" fill="#e6f4ea" stroke="#34a853" stroke-width="2"/>
  <text x="450" y="405" text-anchor="middle" font-size="14" font-weight="700">Pinecone Index</text>
  <text x="450" y="425" text-anchor="middle" font-size="12">namespace: food_prices | namespace: poverty_mpi</text>
  <text x="450" y="441" text-anchor="middle" font-size="11" fill="#555">total 205,525 vectors</text>

  <line x1="170" y1="130" x2="170" y2="170" stroke="#555" stroke-width="2" marker-end="url(#arrow2)"/>
  <line x1="730" y1="130" x2="730" y2="170" stroke="#555" stroke-width="2" marker-end="url(#arrow2)"/>
  <line x1="170" y1="230" x2="170" y2="270" stroke="#555" stroke-width="2" marker-end="url(#arrow2)"/>
  <line x1="730" y1="230" x2="730" y2="270" stroke="#555" stroke-width="2" marker-end="url(#arrow2)"/>
  <line x1="200" y1="330" x2="380" y2="380" stroke="#555" stroke-width="2" marker-end="url(#arrow2)"/>
  <line x1="700" y1="330" x2="530" y2="380" stroke="#555" stroke-width="2" marker-end="url(#arrow2)"/>

  <text x="450" y="470" text-anchor="middle" font-size="12" fill="#777">Two parallel ingestion tracks converge into one Pinecone index, split by namespace</text>
</g>
<g transform="translate(40,1190)">
  <defs>
    <marker id="arrow3" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#555"/>
    </marker>
  </defs>
  <rect width="900" height="640" fill="#ffffff"/>
  <text x="450" y="35" text-anchor="middle" font-size="20" font-weight="700" fill="#1a1a1a">Retrieval &amp; Generation Path — Detail</text>

  <rect x="340" y="65" width="220" height="55" rx="8" fill="#fce8e6" stroke="#ea4335" stroke-width="2"/>
  <text x="450" y="98" text-anchor="middle" font-size="13" font-weight="600">User Query</text>

  <rect x="300" y="150" width="300" height="60" rx="8" fill="#f3e8fd" stroke="#a142f4" stroke-width="2"/>
  <text x="450" y="175" text-anchor="middle" font-size="13" font-weight="600">FastAPI + HTTPBasic Auth</text>
  <text x="450" y="193" text-anchor="middle" font-size="11">request validated</text>

  <rect x="300" y="240" width="300" height="60" rx="8" fill="#fef7e0" stroke="#f9ab00" stroke-width="2"/>
  <text x="450" y="265" text-anchor="middle" font-size="13" font-weight="600">Query Router</text>
  <text x="450" y="283" text-anchor="middle" font-size="11">picks namespace + top-k</text>

  <rect x="120" y="330" width="280" height="65" rx="8" fill="#e6f4ea" stroke="#34a853" stroke-width="2"/>
  <text x="260" y="355" text-anchor="middle" font-size="12" font-weight="600">Pinecone Similarity Search</text>
  <text x="260" y="373" text-anchor="middle" font-size="11">namespace: food_prices</text>
  <text x="260" y="388" text-anchor="middle" font-size="11" fill="#555">top-k = 100</text>

  <rect x="500" y="330" width="280" height="65" rx="8" fill="#e6f4ea" stroke="#34a853" stroke-width="2"/>
  <text x="640" y="355" text-anchor="middle" font-size="12" font-weight="600">Pinecone Similarity Search</text>
  <text x="640" y="373" text-anchor="middle" font-size="11">namespace: poverty_mpi</text>
  <text x="640" y="388" text-anchor="middle" font-size="11" fill="#555">top-k = 50</text>

  <rect x="300" y="430" width="300" height="60" rx="8" fill="#fef7e0" stroke="#f9ab00" stroke-width="2"/>
  <text x="450" y="455" text-anchor="middle" font-size="13" font-weight="600">LCEL Prompt Assembly</text>
  <text x="450" y="473" text-anchor="middle" font-size="11">LangChain</text>

  <rect x="320" y="520" width="260" height="55" rx="8" fill="#fef7e0" stroke="#f9ab00" stroke-width="2"/>
  <text x="450" y="553" text-anchor="middle" font-size="13" font-weight="600">Claude Haiku</text>

  <rect x="330" y="600" width="240" height="0" fill="none"/>
  <rect x="330" y="600" width="0" height="0"/>

  <rect x="330" y="600" width="240" height="0"/>
  <rect x="330" y="600" width="0" height="0"/>

  <rect x="330" y="600" width="240" height="30" rx="8" fill="none"/>

  <!-- Cited answer box -->
  <rect x="330" y="600" width="240" height="30" fill="none"/>
  <rect x="330" y="600" width="240" height="30" rx="8" fill="#fce8e6" stroke="#ea4335" stroke-width="2" opacity="0"/>

  <rect x="330" y="600" width="0" height="0"/>

  <rect x="330" y="600" width="240" height="30" rx="0" fill="none"/>

  <!-- final answer box drawn correctly below -->
  <g>
    <rect x="330" y="600" width="0" height="0"/>
  </g>

  <rect x="330" y="600" width="240" height="30" rx="8" fill="#fce8e6" stroke="#ea4335" stroke-width="2"/>
  <text x="450" y="620" text-anchor="middle" font-size="12" font-weight="600">Cited Answer</text>

  <line x1="450" y1="120" x2="450" y2="150" stroke="#555" stroke-width="2" marker-end="url(#arrow3)"/>
  <line x1="450" y1="210" x2="450" y2="240" stroke="#555" stroke-width="2" marker-end="url(#arrow3)"/>
  <line x1="400" y1="300" x2="290" y2="330" stroke="#555" stroke-width="2" marker-end="url(#arrow3)"/>
  <line x1="500" y1="300" x2="610" y2="330" stroke="#555" stroke-width="2" marker-end="url(#arrow3)"/>
  <line x1="290" y1="395" x2="400" y2="430" stroke="#555" stroke-width="2" marker-end="url(#arrow3)"/>
  <line x1="610" y1="395" x2="500" y2="430" stroke="#555" stroke-width="2" marker-end="url(#arrow3)"/>
  <line x1="450" y1="490" x2="450" y2="520" stroke="#555" stroke-width="2" marker-end="url(#arrow3)"/>
  <line x1="450" y1="575" x2="450" y2="600" stroke="#555" stroke-width="2" marker-end="url(#arrow3)"/>

</g>
</svg>